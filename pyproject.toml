[project]
name = "squirl-parser"
version = "0.1.0"
description = "Bank statement PDF parser service for Squirl (SBI, Kotak)"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "cryptography>=42",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
